<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#12372a" />
    <title>Kamera Absensi | Ruang Hadir</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { theme: { extend: { colors: { forest: "#12372a", leaf: "#2f6b4f", lime: "#d9f99d", paper: "#f4f0e6", ink: "#17211b" }, fontFamily: { body: ["Trebuchet MS", "sans-serif"] } } } };
    </script>
  </head>
  <body class="min-h-screen bg-[radial-gradient(circle_at_90%_5%,#d9f99d_0,transparent_30%),linear-gradient(145deg,#f8f4e9,#dfeadd)] font-body text-ink">
    <main class="mx-auto flex min-h-screen w-full max-w-xl flex-col gap-4 px-4 pb-[calc(1.75rem+env(safe-area-inset-bottom))] pt-[calc(1.25rem+env(safe-area-inset-top))] sm:px-6 lg:max-w-5xl lg:justify-center">
      <header class="flex items-center justify-between gap-4"><div class="text-xl font-black tracking-tight">Ruang Hadir</div><div class="rounded-full border border-emerald-800/25 bg-white/60 px-3 py-2 text-[11px] font-black uppercase tracking-[.12em]" id="typeBadge">Absensi</div></header>
      <div class="grid gap-4 lg:grid-cols-[.8fr_1.2fr] lg:items-center lg:gap-10">
        <section><p class="mb-3 hidden text-xs font-black uppercase tracking-[.2em] text-leaf lg:block">Verifikasi kehadiran</p><h1 class="text-4xl font-black leading-[.95] tracking-[-.05em] sm:text-5xl lg:text-7xl" id="title">Siapkan wajahmu.</h1><p class="mt-3 text-sm leading-6 text-slate-600 sm:text-base" id="lead">Foto harus diambil sekarang menggunakan kamera depan.</p></section>
        <div class="flex flex-col gap-4">
      <section class="relative mx-auto aspect-[3/4] max-h-[62vh] w-full max-w-md overflow-hidden rounded-[28px_28px_8px_28px] bg-[#07130e] shadow-2xl lg:max-h-[68vh]">
        <video class="h-full w-full -scale-x-100 object-cover" id="video" autoplay muted playsinline></video>
        <canvas class="hidden h-full w-full object-cover" id="canvas"></canvas>
        <div class="pointer-events-none absolute inset-[12%_16%] rounded-[48%_48%_44%_44%] border-2 border-dashed border-lime/80 shadow-[0_0_0_999px_rgba(6,20,13,.24)]" id="guide"></div>
        <div class="absolute left-3.5 top-3.5 rounded-full bg-[#07130ebd] px-3 py-2 text-[10px] font-black uppercase tracking-[.12em] text-white">Kamera langsung</div>
      </section>
      <div class="min-h-11 border-l-4 border-leaf bg-white/70 px-4 py-3 text-sm font-bold leading-5" id="status">Memeriksa tautan absensi...</div>
      <div class="grid grid-cols-2 gap-2.5">
        <button class="col-span-2 min-h-13 rounded-lg bg-forest px-4 py-3.5 text-sm font-black text-white shadow-lg shadow-forest/20 disabled:cursor-not-allowed disabled:opacity-40" id="capture" disabled>Ambil selfie</button>
        <button class="min-h-13 rounded-lg border border-emerald-900/30 bg-white/70 px-4 py-3.5 text-sm font-black text-forest" id="retake" hidden>Foto ulang</button>
        <button class="min-h-13 rounded-lg bg-forest px-4 py-3.5 text-sm font-black text-white shadow-lg shadow-forest/20" id="submit" hidden>Kirim absensi</button>
      </div>
        </div>
      </div>
      <!-- <p class="text-center text-xs leading-5 text-slate-500">Tidak ada akses galeri pada halaman ini. Foto, lokasi GPS, dan token sekali pakai dikirim hanya untuk proses absensi.</p> -->
    </main>
    <script>
      const token = new URLSearchParams(location.search).get("token");
      const video = document.querySelector("#video");
      const canvas = document.querySelector("#canvas");
      const guide = document.querySelector("#guide");
      const statusBox = document.querySelector("#status");
      const captureButton = document.querySelector("#capture");
      const retakeButton = document.querySelector("#retake");
      const submitButton = document.querySelector("#submit");
      let stream;
      let locationData;
      let imageData;

      function setStatus(message, error = false) {
        statusBox.textContent = message;
        statusBox.classList.toggle("border-red-600", error);
        statusBox.classList.toggle("text-red-700", error);
        statusBox.classList.toggle("border-leaf", !error);
      }

      function stopCamera() {
        if (stream) stream.getTracks().forEach((track) => track.stop());
      }

      function getLocation() {
        return new Promise((resolve, reject) => {
          if (!navigator.geolocation) return reject(new Error("GPS tidak didukung perangkat ini."));
          navigator.geolocation.getCurrentPosition(
            (position) => resolve({
              latitude: position.coords.latitude,
              longitude: position.coords.longitude,
              accuracy: position.coords.accuracy,
            }),
            () => reject(new Error("Lokasi tidak dapat dibaca. Izinkan GPS lalu muat ulang halaman.")),
            { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
          );
        });
      }

      async function initialize() {
        if (!token) throw new Error("Token absensi tidak ditemukan.");
        const response = await fetch(`/api/attendance-camera/${encodeURIComponent(token)}`);
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Tautan tidak berlaku.");
        document.querySelector("#typeBadge").textContent = `Absen ${data.tipe}`;
        document.querySelector("#title").textContent = `Halo, ${data.nama}.`;
        document.querySelector("#lead").textContent = `Ambil selfie langsung untuk absen ${data.tipe}. Tautan segera kedaluwarsa.`;
        if (!window.isSecureContext) throw new Error("Kamera membutuhkan alamat HTTPS. Hubungi admin untuk memperbaiki tautan bot.");
        setStatus("Izinkan kamera depan dan lokasi GPS...");
        const results = await Promise.all([
          navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: { ideal: 720 }, height: { ideal: 960 } }, audio: false }),
          getLocation(),
        ]);
        stream = results[0];
        locationData = results[1];
        video.srcObject = stream;
        await video.play();
        captureButton.disabled = false;
        setStatus(`Kamera dan GPS siap (akurasi ${Math.round(locationData.accuracy)} m). Posisikan wajah di dalam garis.`);
      }

      captureButton.addEventListener("click", () => {
        const width = video.videoWidth;
        const height = video.videoHeight;
        if (!width || !height) return setStatus("Kamera belum siap. Tunggu sebentar.", true);
        canvas.width = width;
        canvas.height = height;
        const context = canvas.getContext("2d");
        context.translate(width, 0);
        context.scale(-1, 1);
        context.drawImage(video, 0, 0, width, height);
        imageData = canvas.toDataURL("image/jpeg", .86);
        video.hidden = true;
        canvas.style.display = "block";
        guide.hidden = true;
        captureButton.hidden = true;
        retakeButton.hidden = false;
        submitButton.hidden = false;
        setStatus("Periksa foto. Jika wajah terlihat jelas, kirim absensi.");
      });

      retakeButton.addEventListener("click", () => {
        imageData = null;
        canvas.style.display = "none";
        video.hidden = false;
        guide.hidden = false;
        captureButton.hidden = false;
        retakeButton.hidden = true;
        submitButton.hidden = true;
        setStatus("Posisikan wajah di dalam garis, lalu ambil selfie.");
      });

      submitButton.addEventListener("click", async () => {
        submitButton.disabled = true;
        retakeButton.disabled = true;
        setStatus("Memverifikasi wajah dan lokasi. Jangan tutup halaman...");
        try {
          locationData = await getLocation();
          const response = await fetch(`/api/attendance-camera/${encodeURIComponent(token)}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ image: imageData, ...locationData }),
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || "Absensi gagal diproses.");
          stopCamera();
          document.querySelector("#title").textContent = "Absensi berhasil.";
          document.querySelector("#lead").textContent = `${data.tipe} dicatat pukul ${data.waktu} dengan status ${data.status}.`;
          setStatus("Berhasil. Halaman ini sekarang boleh ditutup.");
          retakeButton.hidden = true;
          submitButton.hidden = true;
        } catch (error) {
          setStatus(error.message, true);
          submitButton.hidden = true;
          retakeButton.hidden = true;
        }
      });

      window.addEventListener("pagehide", stopCamera);
      initialize().catch((error) => {
        setStatus(error.message || "Kamera tidak dapat dimulai.", true);
        captureButton.disabled = true;
      });
    </script>
  </body>
</html>
