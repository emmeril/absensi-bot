<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#12372a" />
    <title>Kamera Absensi | Ruang Hadir</title>
    <style>
      :root { --forest:#12372a; --leaf:#2f6b4f; --lime:#d9f99d; --paper:#f4f0e6; --ink:#17211b; --danger:#b42318; }
      * { box-sizing:border-box; }
      body { margin:0; min-height:100vh; color:var(--ink); background:radial-gradient(circle at 90% 5%,#d9f99d 0,transparent 30%),linear-gradient(145deg,#f8f4e9,#dfeadd); font-family:Georgia,"Times New Roman",serif; }
      main { width:min(100%,560px); min-height:100vh; margin:auto; padding:calc(20px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:16px; }
      header { display:flex; align-items:center; justify-content:space-between; gap:16px; }
      .brand { font-weight:800; letter-spacing:-.03em; font-size:1.25rem; }
      .badge { border:1px solid #aac5b4; border-radius:999px; padding:7px 11px; font:700 .72rem Arial,sans-serif; text-transform:uppercase; letter-spacing:.09em; background:#ffffff99; }
      h1 { margin:8px 0 3px; font-size:clamp(2rem,9vw,3.3rem); line-height:.95; letter-spacing:-.055em; }
      .lead { margin:0; color:#526259; font:400 .95rem/1.5 Arial,sans-serif; }
      .camera { position:relative; overflow:hidden; aspect-ratio:3/4; max-height:62vh; border-radius:28px 28px 8px 28px; background:#07130e; box-shadow:0 22px 55px #173e2a35; }
      video,canvas { width:100%; height:100%; object-fit:cover; display:block; }
      video { transform:scaleX(-1); }
      canvas { display:none; }
      .guide { position:absolute; inset:12% 16%; border:2px dashed #d9f99dcc; border-radius:48% 48% 44% 44%; pointer-events:none; box-shadow:0 0 0 999px #06140d3d; }
      .camera-label { position:absolute; left:14px; top:14px; border-radius:999px; padding:7px 10px; color:white; background:#07130ebd; font:700 .7rem Arial,sans-serif; letter-spacing:.08em; text-transform:uppercase; }
      .status { min-height:44px; padding:12px 14px; border-left:4px solid var(--leaf); background:#fff9; font:600 .86rem/1.45 Arial,sans-serif; }
      .status.error { border-color:var(--danger); color:var(--danger); }
      .actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
      button { min-height:52px; border:0; border-radius:7px; padding:12px 16px; font:800 .9rem Arial,sans-serif; cursor:pointer; }
      button.primary { color:white; background:var(--forest); box-shadow:0 8px 18px #12372a33; }
      button.secondary { color:var(--forest); border:1px solid #9bb4a5; background:#fff9; }
      button:disabled { cursor:not-allowed; opacity:.45; box-shadow:none; }
      .wide { grid-column:1/-1; }
      .fineprint { margin:0; text-align:center; color:#68766e; font:400 .72rem/1.45 Arial,sans-serif; }
      [hidden] { display:none !important; }
    </style>
  </head>
  <body>
    <main>
      <header><div class="brand">Ruang Hadir</div><div class="badge" id="typeBadge">Absensi</div></header>
      <section><h1 id="title">Siapkan wajahmu.</h1><p class="lead" id="lead">Foto harus diambil sekarang menggunakan kamera depan.</p></section>
      <section class="camera">
        <video id="video" autoplay muted playsinline></video>
        <canvas id="canvas"></canvas>
        <div class="guide" id="guide"></div>
        <div class="camera-label">Kamera langsung</div>
      </section>
      <div class="status" id="status">Memeriksa tautan absensi...</div>
      <div class="actions">
        <button class="primary wide" id="capture" disabled>Ambil selfie</button>
        <button class="secondary" id="retake" hidden>Foto ulang</button>
        <button class="primary" id="submit" hidden>Kirim absensi</button>
      </div>
      <p class="fineprint">Tidak ada akses galeri pada halaman ini. Foto, lokasi GPS, dan token sekali pakai dikirim hanya untuk proses absensi.</p>
    </main>
    <script>
      const token = new URLSearchParams(location.search).get("token");
      const video = document.querySelector("#video");
      const canvas = document.querySelector("#canvas");
      const guide = document.querySelector("#guide");
      const statusBox = document.querySelector("#status");
      const captureButton = document.querySelector("#capture");
      const retakeButton = document.querySelector("#retake");
      const submitButton = document.querySelector("#submit");
      let stream;
      let locationData;
      let imageData;

      function setStatus(message, error = false) {
        statusBox.textContent = message;
        statusBox.classList.toggle("error", error);
      }

      function stopCamera() {
        if (stream) stream.getTracks().forEach((track) => track.stop());
      }

      function getLocation() {
        return new Promise((resolve, reject) => {
          if (!navigator.geolocation) return reject(new Error("GPS tidak didukung perangkat ini."));
          navigator.geolocation.getCurrentPosition(
            (position) => resolve({
              latitude: position.coords.latitude,
              longitude: position.coords.longitude,
              accuracy: position.coords.accuracy,
            }),
            () => reject(new Error("Lokasi tidak dapat dibaca. Izinkan GPS lalu muat ulang halaman.")),
            { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
          );
        });
      }

      async function initialize() {
        if (!token) throw new Error("Token absensi tidak ditemukan.");
        const response = await fetch(`/api/attendance-camera/${encodeURIComponent(token)}`);
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Tautan tidak berlaku.");
        document.querySelector("#typeBadge").textContent = `Absen ${data.tipe}`;
        document.querySelector("#title").textContent = `Halo, ${data.nama}.`;
        document.querySelector("#lead").textContent = `Ambil selfie langsung untuk absen ${data.tipe}. Tautan segera kedaluwarsa.`;
        if (!window.isSecureContext) throw new Error("Kamera membutuhkan alamat HTTPS. Hubungi admin untuk memperbaiki tautan bot.");
        setStatus("Izinkan kamera depan dan lokasi GPS...");
        const results = await Promise.all([
          navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: { ideal: 720 }, height: { ideal: 960 } }, audio: false }),
          getLocation(),
        ]);
        stream = results[0];
        locationData = results[1];
        video.srcObject = stream;
        await video.play();
        captureButton.disabled = false;
        setStatus(`Kamera dan GPS siap (akurasi ${Math.round(locationData.accuracy)} m). Posisikan wajah di dalam garis.`);
      }

      captureButton.addEventListener("click", () => {
        const width = video.videoWidth;
        const height = video.videoHeight;
        if (!width || !height) return setStatus("Kamera belum siap. Tunggu sebentar.", true);
        canvas.width = width;
        canvas.height = height;
        const context = canvas.getContext("2d");
        context.translate(width, 0);
        context.scale(-1, 1);
        context.drawImage(video, 0, 0, width, height);
        imageData = canvas.toDataURL("image/jpeg", .86);
        video.hidden = true;
        canvas.style.display = "block";
        guide.hidden = true;
        captureButton.hidden = true;
        retakeButton.hidden = false;
        submitButton.hidden = false;
        setStatus("Periksa foto. Jika wajah terlihat jelas, kirim absensi.");
      });

      retakeButton.addEventListener("click", () => {
        imageData = null;
        canvas.style.display = "none";
        video.hidden = false;
        guide.hidden = false;
        captureButton.hidden = false;
        retakeButton.hidden = true;
        submitButton.hidden = true;
        setStatus("Posisikan wajah di dalam garis, lalu ambil selfie.");
      });

      submitButton.addEventListener("click", async () => {
        submitButton.disabled = true;
        retakeButton.disabled = true;
        setStatus("Memverifikasi wajah dan lokasi. Jangan tutup halaman...");
        try {
          locationData = await getLocation();
          const response = await fetch(`/api/attendance-camera/${encodeURIComponent(token)}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ image: imageData, ...locationData }),
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || "Absensi gagal diproses.");
          stopCamera();
          document.querySelector("#title").textContent = "Absensi berhasil.";
          document.querySelector("#lead").textContent = `${data.tipe} dicatat pukul ${data.waktu} dengan status ${data.status}.`;
          setStatus("Berhasil. Halaman ini sekarang boleh ditutup.");
          retakeButton.hidden = true;
          submitButton.hidden = true;
        } catch (error) {
          setStatus(error.message, true);
          submitButton.hidden = true;
          retakeButton.hidden = true;
        }
      });

      window.addEventListener("pagehide", stopCamera);
      initialize().catch((error) => {
        setStatus(error.message || "Kamera tidak dapat dimulai.", true);
        captureButton.disabled = true;
      });
    </script>
  </body>
</html>
